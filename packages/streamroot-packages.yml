  (Streamroot DNA / Mesh Delivery), distributed as video-player plugins rather than
  a server-side REST API. The standalone company was acquired by CenturyLink (now
  Lumen Technologies) in 2019; the streamroot.io site/docs are offline and the npm
  packages below are published (official) but deprecated / no longer supported.
