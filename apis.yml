name: Streamroot
description: >-
  Streamroot was a Paris-founded video-delivery company (backed by Partech and
  Techstars) that built a peer-to-peer / multi-CDN "Mesh Delivery" and DNA SDK to
  offload live and on-demand video traffic onto a hybrid CDN+WebRTC peer mesh,
  reducing bandwidth cost and improving scale for broadcasters and OTT platforms.
  The developer surface was a client-side (browser and native player) delivery SDK
  distributed as video-player plugins (video.js, Clappr, hls.js, AVPlayer) rather
  than a server-side REST API. Streamroot was acquired by CenturyLink — now Lumen
  Technologies — in 2019 and folded into Lumen's CDN / Mesh Delivery product line.
  The standalone streamroot.io website and developer docs are offline; the
  surviving public assets are the (now Lumen-operated) GitHub organization and a
  set of official but deprecated npm player-plugin packages.
